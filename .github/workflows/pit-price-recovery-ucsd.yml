name: PIT archival price recovery

on:
  push:
    branches:
      - pit-price-recovery-ucsd
    paths:
      - '.github/workflows/pit-price-recovery-ucsd.yml'
      - 'research/pit_price_recovery_trigger.txt'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch survivorship-free WIKI-derived S&P data
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/teddykoker/survivorship-free-spy.git source
          mkdir -p selected
          git -C source rev-parse HEAD | tee selected/source_commit.txt
          echo 'https://github.com/teddykoker/survivorship-free-spy' > selected/source_url.txt

      - name: Extract PIT blocker tickers
        shell: bash
        run: |
          set -euo pipefail
          blockers='NSM RSH MEE PETM CDAY CSRA NOVL AYE ENDP MDP EK ODP GMCR PTV EVHC CBE DWDP MIL STR XTO MMI WCG ANR BJS SBNY RX CPGX CVG DYN BXLT JOYG SGP CTX RE CMCSK ESV ACAS JNY DLPH EP CPWR GENZ KG'
          printf 'ticker,status,source_file,rows,first_date,last_date,sha256\n' > selected/manifest.csv
          for t in $blockers; do
            f="source/survivorship-free/data/${t}.csv"
            if [ -f "$f" ]; then
              cp "$f" "selected/${t}.csv"
              rows=$(awk 'END{print NR-1}' "$f")
              first=$(awk -F, 'NR==2 {gsub("\\r","",$1); print $1; exit}' "$f")
              last=$(awk -F, 'END {gsub("\\r","",$1); print $1}' "$f")
              h=$(sha256sum "$f" | awk '{print $1}')
              printf '%s,FOUND,%s,%s,%s,%s,%s\n' "$t" "$f" "$rows" "$first" "$last" "$h" >> selected/manifest.csv
            else
              printf '%s,NOT_FOUND,,0,,,\n' "$t" >> selected/manifest.csv
            fi
          done
          cat selected/manifest.csv

      - name: Validate CSVs
        shell: python
        run: |
          import csv, glob, json, os
          out=[]
          for p in sorted(glob.glob("selected/*.csv")):
              if p.endswith("manifest.csv"): continue
              with open(p,newline="",encoding="utf-8-sig",errors="replace") as f:
                  r=csv.reader(f); header=next(r,[])
              lower=[x.strip().lower() for x in header]
              req={"date","open","high","low","close","volume"}
              out.append({"file":os.path.basename(p),"header":header,"required_ohlcv_present":req.issubset(set(lower))})
          with open("selected/schema_validation.json","w") as f:
              json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))

      - name: Upload recovered WIKI blocker prices
        uses: actions/upload-artifact@v4
        with:
          name: pit-wiki-blocker-prices
          path: selected/
          if-no-files-found: error
          retention-days: 7
