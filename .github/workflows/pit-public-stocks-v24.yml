name: PIT V24 public stocks archive extraction

on:
  push:
    branches: [chatgpt-pit-qstk-v35]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download public stocks archive and extract PIT blockers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/files out/receipts
          curl -fsSL "https://raw.githubusercontent.com/sryza/aas/master/ch09-risk/data/stocks.zip" -o /tmp/stocks.zip
          python - <<'PY'
          import csv, hashlib, io, json, pathlib, zipfile
          tickers = ["NSM","RSH","MEE","PETM","CDAY","CSRA","NOVL","AYE","ENDP","MDP","EK","ODP","GMCR","PTV","EVHC","CBE","DWDP","MIL","STR","XTO","MMI","WCG","ANR","BJS","SBNY","RX","CPGX","CVG","DYN","BXLT","JOYG","SGP","CTX","RE","CMCSK","ESV","ACAS","JNY","DLPH","EP","CPWR","GENZ","KG"]
          aliases = {"EK":["EK","EKDKQ"],"RSH":["RSH","RSHCQ"]}
          z=zipfile.ZipFile("/tmp/stocks.zip")
          lower={n.lower():n for n in z.namelist()}
          out=pathlib.Path("out/files")
          rec=[]
          for ticker in tickers:
              candidates=aliases.get(ticker,[ticker])
              found=None
              for c in candidates:
                  for key,n in lower.items():
                      if key.endswith("/"+c.lower()+".csv") or key==c.lower()+".csv":
                          found=n; break
                  if found: break
              if not found:
                  rec.append({"ticker":ticker,"status":"NOT_IN_ARCHIVE"})
                  continue
              data=z.read(found)
              fp=out/f"{ticker}.csv"; fp.write_bytes(data)
              text=data.decode("utf-8-sig",errors="replace")
              rows=list(csv.DictReader(io.StringIO(text)))
              dates=[]
              valid=0
              for row in rows:
                  d=(row.get("Date") or row.get("date") or "").strip()
                  if d: dates.append(d)
                  vals=[row.get(k) for k in ["Open","High","Low","Close","Volume"]]
                  if all(v is not None and str(v).strip() and str(v).strip().lower()!="nan" for v in vals):
                      valid+=1
              rec.append({
                  "ticker":ticker,"status":"FOUND","archive_member":found,
                  "bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),
                  "rows":len(rows),"valid_ohlcv_rows":valid,
                  "first_date_raw":dates[-1] if dates else None,
                  "last_date_raw":dates[0] if dates else None
              })
          pathlib.Path("out/receipts/public_stocks_archive_receipts.json").write_text(json.dumps(rec,indent=2),encoding="utf-8")
          fields=sorted({k for r in rec for k in r})
          with open("out/receipts/public_stocks_archive_receipts.csv","w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rec)
          print("found",sum(r["status"]=="FOUND" for r in rec),"of",len(rec))
          print(json.dumps(rec,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pit-v24-public-stocks
          path: out/
          retention-days: 7
