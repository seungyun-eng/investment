name: V73 catalog FDIC original recovery
on:
  push:
    branches: [chatgpt-v73-raw-recovery-20260930]
    paths: [.github/workflows/v73-fdic-originals.yml]
permissions:
  contents: read
concurrency:
  group: v73-primary-document-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Retrieve original public bank filings
        run: |
          mkdir -p out/raw
          python3 - <<'PY'
          import datetime,hashlib,json,pathlib,time,urllib.request,urllib.error
          root=pathlib.Path('out');rows=[];stopped=False
          ids=[(137,1),(172,1),(226,1),(234,1),(315,1),(326,1),(402,1),(407,1),(407,2),(538,1),(551,1),(650,1),(658,1),(708,1),(709,1),(768,1),(772,1),(849,1),(857,1),(925,1),(929,1),(979,1),(980,1),(1032,1),(1035,1),(1136,1),(1139,1),(1213,1),(1237,1),(1301,1),(1305,1),(1401,1),(1402,1),(1498,1),(1502,1),(1570,1),(1580,1),(1628,1),(1634,1),(1721,1),(1729,1),(1840,1),(1846,1),(1928,1),(1937,1),(3006,1),(3010,1),(4102,1),(4104,1),(4198,1),(4201,1),(4337,1),(4339,1),(4427,1),(4432,1),(4518,1),(4523,1),(4627,1),(4631,1),(4720,1),(4724,1),(4806,1),(4813,1),(4904,1),(4908,1),(5027,1),(5028,1),(5103,1),(5104,1),(5176,1),(5179,1),(5276,1),(5277,1),(5383,1),(5387,1),(5474,1),(5479,1),(5542,1),(5548,1),(5632,1),(5637,1),(5743,1),(5745,1),(5832,1),(5846,1),(5914,1),(5915,1),(7992,1),(7994,1),(8077,1),(8079,1),(8136,1),(8137,1),(9188,1),(9195,1),(11265,1),(11266,1)]
          for filing,attachment in ids:
            url=f'https://securitiesfilings.fdicconnect.fdic.gov/api/instflng/{filing}/attachment/{attachment}'
            row={'url':url,'filing_id':filing,'attachment':attachment,'retrieved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':'PENDING','financial_approval':False}
            if stopped:row['status']='SKIPPED_ACCESS_STOP';rows.append(row);continue
            time.sleep(1)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'V73Research/1.0 (https://github.com/seungyun-eng/investment)','Accept-Encoding':'identity'})
              with urllib.request.urlopen(req,timeout=60) as resp:data=resp.read(32*1024*1024+1);row.update(http_status=resp.status,response_url=resp.geturl(),content_type=resp.headers.get('Content-Type'))
              if len(data)>32*1024*1024:raise ValueError('document exceeds 32 MiB bound')
              if not data.lstrip().startswith(b'%PDF-'):raise ValueError('response is not a PDF original')
              digest=hashlib.sha256(data).hexdigest();dest=root/'raw'/(digest+'.pdf');dest.write_bytes(data)
              row.update(status='RETRIEVED',sha256=digest,bytes=len(data),file=str(dest.relative_to(root)))
            except urllib.error.HTTPError as e:
              row.update(status='HTTP_ERROR',http_status=e.code,error=str(e));stopped=e.code in (401,403,429)
            except Exception as e:row.update(status='ERROR',error=type(e).__name__+': '+str(e))
            rows.append(row);(root/'download_receipts.json').write_text(json.dumps(rows,indent=2));print(json.dumps(row),flush=True)
          (root/'download_receipts.json').write_text(json.dumps(rows,indent=2))
          summary={'source_records':len(ids),'retrieved_records':sum(x['status']=='RETRIEVED' for x in rows),'unique_originals':len(list((root/'raw').glob('*.pdf'))),'bytes':sum(p.stat().st_size for p in (root/'raw').glob('*.pdf')),'access_stop':stopped,'feature_approvals':0,'backtest':False,'sec_access_stop_preserved':True}
          (root/'summary.json').write_text(json.dumps(summary,indent=2));print('SUMMARY '+json.dumps(summary))
          PY
      - name: Preserve actual original bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v73-fdic-originals-${{ github.run_id }}
          path: out/
          retention-days: 1
          compression-level: 9
