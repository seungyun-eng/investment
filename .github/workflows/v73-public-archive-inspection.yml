name: V73 public filing archive inspection
on:
  push:
    branches: [chatgpt-v73-raw-recovery-20260930]
    paths: [.github/workflows/v73-public-archive-inspection.yml]
permissions:
  contents: read
concurrency:
  group: v73-public-archive-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install file-format reader
        run: python3 -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: Inspect public repository metadata and one archived filing partition
        run: |
          mkdir -p out/raw out/samples
          python3 - <<'PY'
          import datetime,gzip,hashlib,json,pathlib,time,urllib.request,urllib.error,urllib.parse,urllib.robotparser
          import pyarrow.parquet as pq
          root=pathlib.Path('out'); receipts=[];stop=False
          def request(url,bound):
            global stop
            if stop:raise RuntimeError('PRESERVED_HF_ACCESS_STOP')
            time.sleep(1)
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'V73Research/1.0 (research contact: seungyun@berkeley.edu)','Accept-Encoding':'identity'}),timeout=120) as r:
                data=r.read(bound+1)
                if len(data)>bound:raise ValueError('response exceeds bounded inspection')
                receipts.append({'url':url,'response_url':r.geturl(),'status':r.status,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'time':datetime.datetime.now(datetime.timezone.utc).isoformat()})
                return data
            except urllib.error.HTTPError as e:
              receipts.append({'url':url,'status':e.code,'error':str(e)})
              if e.code in (401,403,429):stop=True
              raise
          summaries=[]
          try:
            rb=request('https://huggingface.co/robots.txt',2*1024*1024);(root/'robots.txt').write_bytes(rb)
            for form in ['10-K','10-Q']:
              repo='TeraflopAI/'+form+'-text'
              meta=request('https://huggingface.co/api/datasets/'+repo,12*1024*1024);m=json.loads(meta);(root/(form+'_repository.json')).write_bytes(meta)
              files=[x['rfilename'] for x in m.get('siblings',[]) if x['rfilename'].endswith('.parquet')]
              summaries.append({'repo':repo,'revision':m['sha'],'gated':m.get('gated'),'private':m.get('private'),'cardData':m.get('cardData'),'parquet_files':len(files)})
              if m.get('gated') or m.get('private') or not files:continue
              url='https://huggingface.co/datasets/'+repo+'/resolve/'+m['sha']+'/'+urllib.parse.quote(files[0],safe='/')
              data=request(url,200*1024*1024);p=pathlib.Path('sample.parquet');p.write_bytes(data)
              pf=pq.ParquetFile(p);schema=str(pf.schema_arrow)
              (root/(form+'_schema.txt')).write_text(schema)
              meta_cols=[x for x in pf.schema_arrow.names if x!='content' and x!='text']
              metadata=pf.read(columns=meta_cols);metadata.write_csv if False else None
              rows=metadata.to_pylist();(root/(form+'_partition_index.json')).write_text(json.dumps(rows,indent=2))
              stats={'file':files[0],'file_bytes':len(data),'file_sha256':hashlib.sha256(data).hexdigest(),'rows':pf.metadata.num_rows,'row_groups':pf.metadata.num_row_groups,'columns':pf.schema_arrow.names}
              sample=[]
              for batch in pf.iter_batches(batch_size=8):
                for i,row in enumerate(batch.to_pylist()):
                  if len(sample)>=8:break
                  content=row.get('content');text=row.get('text');key=f'{form}_{len(sample):03}'
                  if isinstance(content,str):
                    b=content.encode('utf-8');(root/'samples'/(key+'.content.gz')).write_bytes(gzip.compress(b,mtime=0));row['content_file']='samples/'+key+'.content.gz';row['content_sha256']=hashlib.sha256(b).hexdigest();row['content_length']=len(b);row.pop('content',None)
                  row.pop('text',None);row['clean_text_length']=len(text) if isinstance(text,str) else None;row['source_repo']=repo;row['source_revision']=m['sha'];row['source_partition']=files[0];row['archive_bytes_verified_as_sec_original']=False;sample.append(row)
                break
              (root/(form+'_sample_metadata.json')).write_text(json.dumps(sample,indent=2));(root/(form+'_partition.json')).write_text(json.dumps(stats,indent=2));p.unlink()
          except Exception as e:
            (root/'error.txt').write_text(type(e).__name__+': '+str(e))
          (root/'repository_summary.json').write_text(json.dumps(summaries,indent=2));(root/'receipts.json').write_text(json.dumps(receipts,indent=2));print(json.dumps(summaries));print('SEC host access stop unchanged; archive inspection is not primary-source approval.')
          PY
      - name: Preserve exact inspection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v73-public-archive-inspection-${{ github.run_id }}
          path: out/
          retention-days: 1
          compression-level: 9
