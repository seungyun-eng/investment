name: V73 primary-document recovery
on:
  push:
    branches: [chatgpt-v73-raw-recovery-20260930]
    paths: [.github/workflows/v73-raw-recovery.yml]
permissions:
  contents: read
concurrency:
  group: v73-primary-document-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download original public filings and issuer reports
        shell: bash
        run: |
          mkdir -p out/raw
          python3 - <<'PY'
          import datetime, gzip, hashlib, json, pathlib, time, urllib.request, urllib.error, urllib.parse
          root=pathlib.Path('out'); rows=[]; blocked=set()
          sources=[
            ('msft_2020_sec','https://www.sec.gov/Archives/edgar/data/789019/000156459020034944/msft-10k_20200630.htm','0e1b83d390e41c0a4dd79630ccec3c9f2bf04309cd94a7990ac4a24fc4a6eba9'),
            ('msft_2019_sec','https://www.sec.gov/Archives/edgar/data/789019/000156459019027952/msft-10k_20190630.htm','ff38993df60fd66368e47a47e8f8d51586c9197e3d6c9dcab5803a00cc4a5218'),
            ('msft_2021_sec','https://www.sec.gov/Archives/edgar/data/789019/000156459021039151/msft-10k_20210630.htm','0cdddd9409d55b933bb5b9d3f8cc3fbb3c7f3390a531406aea2b1a0ba4bbf999'),
            ('msft_2022_sec','https://www.sec.gov/Archives/edgar/data/789019/000156459022026876/msft-10k_20220630.htm','d8c69513cd820ecdfa3b22decf2672591ced88996188c218d3ffa1439b6b528f'),
            ('mil_2008_sec','https://www.sec.gov/Archives/edgar/data/66479/000119312509041036/d10k.htm',''),
            ('mil_2009_sec','https://www.sec.gov/Archives/edgar/data/66479/000119312510042703/d10k.htm',''),
            ('pcg_2015q2_sec','https://www.sec.gov/Archives/edgar/data/1004980/000100498015000053/form10q.htm',''),
            ('msft_2019_issuer','https://www.microsoft.com/investor/reports/ar19/',''),
            ('msft_2020_issuer','https://www.microsoft.com/investor/reports/ar20/',''),
            ('msft_2021_issuer','https://www.microsoft.com/investor/reports/ar21/',''),
            ('msft_2022_issuer','https://www.microsoft.com/investor/reports/ar22/','')]
          for label,url,expected in sources:
            host=urllib.parse.urlparse(url).hostname
            group='sec.gov' if host and host.endswith('sec.gov') else host
            row={'label':label,'url':url,'expected_sha256':expected or None,'retrieved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'approved_feature':False}
            if group in blocked:
              row['status']='SKIPPED_HOST_ACCESS_STOP'; rows.append(row); continue
            time.sleep(1.0)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'V73Research/1.0 (public academic-style research; https://github.com/seungyun-eng/investment)','Accept-Encoding':'identity'})
              with urllib.request.urlopen(req,timeout=60) as resp:
                data=resp.read(32*1024*1024+1)
                if len(data)>32*1024*1024: raise ValueError('document exceeds 32 MiB per-file safety bound')
                row['http_status']=resp.status; row['content_type']=resp.headers.get('Content-Type'); row['response_url']=resp.geturl()
              if b'<html' not in data[:10000].lower() and b'<!doctype' not in data[:10000].lower():
                raise ValueError('response is not recognized as an HTML document')
              digest=hashlib.sha256(data).hexdigest(); destination=root/'raw'/(digest+'.html')
              destination.write_bytes(data)
              row.update(status='RETRIEVED',bytes=len(data),sha256=digest,file=str(destination.relative_to(root)),expected_sha_match=(digest==expected) if expected else None)
              if expected and digest!=expected: row['status']='RETRIEVED_HASH_MISMATCH_REVIEW_REQUIRED'
            except urllib.error.HTTPError as exc:
              row.update(status='HTTP_ERROR',http_status=exc.code,error=str(exc))
              if exc.code in (403,429): blocked.add(group)
            except Exception as exc:
              row.update(status='ERROR',error=type(exc).__name__+': '+str(exc))
            rows.append(row)
            (root/'download_receipts.json').write_text(json.dumps(rows,indent=2))
            print(json.dumps(row),flush=True)
          (root/'download_receipts.json').write_text(json.dumps(rows,indent=2))
          summary={'attempted_source_records':len(sources),'retrieved_documents':sum(x['status'].startswith('RETRIEVED') for x in rows),'retrieved_bytes':sum(x.get('bytes',0) for x in rows),'sec_hash_matches':sum(x.get('expected_sha_match') is True for x in rows),'blocked_hosts':sorted(blocked),'feature_values_approved':0,'backtest_run':False,'local_onedrive_modified':False}
          (root/'summary.json').write_text(json.dumps(summary,indent=2));print('SUMMARY '+json.dumps(summary))
          PY
      - name: Preserve actual original bytes and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v73-primary-originals-${{ github.run_id }}
          path: out/
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
