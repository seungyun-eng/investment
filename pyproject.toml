[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-research"
version = "0.1.0"
description = "OneDrive-first stock data, backtest, financial analysis, and ML tools"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "openpyxl>=3.1",
  "xlsxwriter>=3.2",
  "yfinance>=0.2",
  "pandas-datareader>=0.10",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "optuna>=4.0",
  "cmaes>=0.11",
  "plotly>=5.20",
  "selenium>=4.20",
  "webdriver-manager>=4.0",
]

[project.optional-dependencies]
ml = [
  "tensorflow>=2.15",
  "scikit-learn>=1.4",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
